name: PR release GOBLIN GOD v0.19.0

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0190.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Decode trader-controls patch
        run: |
          cat scripts/apply_imm_v0190_trader_controls.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/apply_imm_v0190_trader_controls.py
          test "$(wc -c < /tmp/apply_imm_v0190_trader_controls.py)" -eq 35504

      - name: Adapt release helper to current CSS layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_imm_v0190_trader_controls.py')
          text = path.read_text()
          old = 'css_anchor = "       #${APP.receiptAuditOverlayId}{position:fixed"'
          new = 'css_anchor = "#${APP.traderOverlayId}{position:fixed"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy CSS anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile /tmp/apply_imm_v0190_trader_controls.py

      - name: Apply trader controls
        id: apply
        continue-on-error: true
        run: |
          set +e
          python /tmp/apply_imm_v0190_trader_controls.py > /tmp/apply.log 2>&1
          code=$?
          cat /tmp/apply.log
          echo "$code" > /tmp/apply.status
          exit "$code"

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-v0190-patch-diagnostic
          path: |
            /tmp/apply.log
            /tmp/apply.status
            /tmp/apply_imm_v0190_trader_controls.py
          if-no-files-found: warn

      - name: Validate JavaScript
        if: steps.apply.outcome == 'success'
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate trader classification behavior and protected systems
        if: steps.apply.outcome == 'success'
        run: |
          grep -F '// @version      0.19.0' TornScripture-Item-Market-Margin.user.js
          grep -F "traderViewStorageKey: 'tornscripture-imm-trader-view-v1'" TornScripture-Item-Market-Margin.user.js
          grep -F 'function normalizeTraderDisposition(value)' TornScripture-Item-Market-Margin.user.js
          grep -F 'function markTraderAvoid(id)' TornScripture-Item-Market-Margin.user.js
          grep -F 'function hideTrader(id)' TornScripture-Item-Market-Margin.user.js
          grep -F 'function restoreTrader(id)' TornScripture-Item-Market-Margin.user.js
          grep -F 'data-tsimm-action="trader-hide"' TornScripture-Item-Market-Margin.user.js
          grep -F "action === 'traders-toggle-hidden'" TornScripture-Item-Market-Margin.user.js
          grep -F 'Avoided / hidden' TornScripture-Item-Market-Margin.user.js
          grep -F "v: '0.3.0'" TornScripture-Item-Market-Margin.user.js
          grep -F 'schedulePricedTradeRowRefresh' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeRenderRowBadge' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean release to main
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            scripts/apply_imm_v0190_trader_controls.py.gz.b64 \
            scripts/apply_imm_v0190_trader_controls.py.gz.b64.part* \
            .github/workflows/apply-imm-v0190-trader-controls.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0190.txt
          git commit -m 'Add trader avoid and hidden controls'
          git push origin main

      - name: Fail when patch did not apply
        if: steps.apply.outcome != 'success'
        run: exit 1
