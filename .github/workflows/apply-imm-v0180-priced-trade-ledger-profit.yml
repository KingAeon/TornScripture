name: PR release GOBLIN GOD v0.18.0

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/trigger_imm_v0180.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply ledger-profit feature
        run: python scripts/apply_imm_v0180_priced_trade_ledger_profit.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate ledger badges and protected systems
        shell: bash
        run: |
          set -euo pipefail
          FILE=TornScripture-Item-Market-Margin.user.js
          grep -q '@version      0.18.0' "$FILE"
          grep -q 'function pricedTradeLedgerProjection(item, quantity, unitPrice)' "$FILE"
          grep -q 'function pricedTradeLedgerHtml(projection)' "$FILE"
          grep -q 'LEDGER COST UNKNOWN' "$FILE"
          grep -q 'const seenTokens = new Set()' "$FILE"
          grep -q 'lotMatchesTradeItem' "$FILE"
          grep -q 'quickMaxOverrideArmed' "$FILE"
          grep -q 'Outside an explicitly armed Override MAX action' "$FILE"
          grep -q 'buildTradeExitAudit' "$FILE"
          grep -q 'sellPriority' "$FILE"

      - name: Commit clean feature to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0180_priced_trade_ledger_profit.py .github/workflows/apply-imm-v0180-priced-trade-ledger-profit.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0180.txt
          git commit -m 'Add ledger profit to priced trades in GOBLIN GOD v0.18.0'
          git push origin main
