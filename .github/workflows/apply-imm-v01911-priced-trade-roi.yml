name: Apply IMM v0.19.11 Priced Trade ROI

on:
  push:
    branches:
      - repair/priced-trade-v0.19.11
    paths:
      - scripts/trigger_imm_v01911_priced_trade_roi.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/priced-trade-v0.19.11
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Decode and apply guarded ROI patch
        run: |
          base64 --decode scripts/apply_imm_v01911_priced_trade_roi.py.gz.b64 | gzip --decompress > /tmp/apply_imm_v01911_priced_trade_roi.py
          python /tmp/apply_imm_v01911_priced_trade_roi.py

      - name: Validate JavaScript and protected systems
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.11' TornScripture-Item-Market-Margin.user.js
          grep -F "version: '0.19.11'" TornScripture-Item-Market-Margin.user.js
          grep -F 'const roiPercent = costBasis > 0' TornScripture-Item-Market-Margin.user.js
          grep -F "maximumFractionDigits: 1" TornScripture-Item-Market-Margin.user.js
          grep -F 'primary = `${icon} ${total} ${scope} · ${roiLabel}`;' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeResolvedCandidateRows' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeEnsureNativeMaxButton' TornScripture-Item-Market-Margin.user.js
          grep -F 'function exactDuplicateLedgerPairs' TornScripture-Item-Market-Margin.user.js
          grep -F 'function ledgerFundingSummary' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          if grep -Fq 'primary = `${icon} ${total} ${scope} · ${each}`;' TornScripture-Item-Market-Margin.user.js; then
            echo 'Legacy compact profit-per-item display remains' >&2
            exit 1
          fi

      - name: Commit validated ROI release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            scripts/apply_imm_v01911_priced_trade_roi.py.gz.b64 \
            scripts/trigger_imm_v01911_priced_trade_roi.txt \
            .github/workflows/apply-imm-v01911-priced-trade-roi.yml
          git commit -m 'Show ROI on compact Priced Trade badges'
          git push origin HEAD:repair/priced-trade-v0.19.11
