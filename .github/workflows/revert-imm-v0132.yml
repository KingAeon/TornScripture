name: Revert GOBLIN GOD to v0.13.2

on:
  push:
    paths:
      - scripts/revert_imm_v0132.trigger

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified v0.13.2 userscript
        shell: bash
        run: |
          git checkout b24adc2db19d5ce8e338517642fcc111d344f32e -- TornScripture-Item-Market-Margin.user.js

      - name: Validate rollback
        shell: bash
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          grep -q '@version      0.13.2' TornScripture-Item-Market-Margin.user.js
          grep -q "version: '0.13.2'" TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q "brandName: 'GOBLIN GOD'" TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
          ! grep -q 'INVENTORY_API_CATEGORIES' TornScripture-Item-Market-Margin.user.js
          ! grep -q 'fetchInventoryWithFallback' TornScripture-Item-Market-Margin.user.js

      - name: Commit rollback and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/revert_imm_v0132.trigger .github/workflows/revert-imm-v0132.yml
          git commit -m 'Revert GOBLIN GOD to v0.13.2'
          git push
