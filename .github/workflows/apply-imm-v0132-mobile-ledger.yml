name: Apply GOBLIN GOD v0.13.2 mobile ledger interaction

on:
  push:
    paths:
      - scripts/apply_imm_v0132.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mobile ledger patch
        run: python scripts/apply_imm_v0132.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate mobile ledger and protected systems
        run: |
          grep -q '@version      0.13.2' TornScripture-Item-Market-Margin.user.js
          grep -q 'tsimm-ledger-scroll' TornScripture-Item-Market-Margin.user.js
          grep -q 'z-index:2147483647' TornScripture-Item-Market-Margin.user.js
          grep -q 'document.documentElement || document.body' TornScripture-Item-Market-Margin.user.js
          grep -q 'function quickMaxMaximum' TornScripture-Item-Market-Margin.user.js
          grep -q 'function validWatchListingRow' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit release and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0132.py .github/workflows/apply-imm-v0132-mobile-ledger.yml
          git commit -m "Fix mobile ledger interaction and scrolling in GOBLIN GOD v0.13.2"
          git push
