name: PR release GOBLIN GOD v0.18.8

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0188.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply interaction-stability patch
        run: python scripts/apply_imm_v0188_interaction_stability.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate focus anchoring and protected systems
        run: |
          grep -F '// @version      0.18.8' TornScripture-Item-Market-Margin.user.js
          grep -F "if (activeRow?.isConnected" TornScripture-Item-Market-Margin.user.js
          grep -F "return { mode: 'row', row: activeRow" TornScripture-Item-Market-Margin.user.js
          grep -F "if (anchor.mode !== 'row'" TornScripture-Item-Market-Margin.user.js
          grep -F 'if (activeRow !== anchor.row) return;' TornScripture-Item-Market-Margin.user.js
          grep -F 'height:62px!important' TornScripture-Item-Market-Margin.user.js
          grep -F 'overflow-anchor:none!important' TornScripture-Item-Market-Margin.user.js
          grep -F 'schedulePricedTradeRowRefresh' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeRenderRowBadge' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradePickerObserver.observe(document.body' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean hotfix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0188_interaction_stability.py .github/workflows/apply-imm-v0188-pr-release.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0188.txt
          git commit -m 'Stabilize Priced Trade scrolling and quantity input'
          git push origin main
