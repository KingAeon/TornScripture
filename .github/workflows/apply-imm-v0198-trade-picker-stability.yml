name: Release GOBLIN GOD v0.19.8 trade picker stability

on:
  push:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0198_trade_picker_stability.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply trade picker stability patch
        run: python scripts/apply_imm_v0198_trade_picker_stability.py

      - name: Validate JavaScript and protected systems
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.8' TornScripture-Item-Market-Margin.user.js
          grep -F "const PRICED_TRADE_MAX_CLASS = 'tsimm-priced-trade-native-max';" TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeEnsureNativeMaxButton' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeReconcileVisibleRows' TornScripture-Item-Market-Margin.user.js
          grep -F 'schedulePricedTradeScrollSettle();' TornScripture-Item-Market-Margin.user.js
          grep -F 'function capturePricedTradeQuantityEvent(event)' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeEnsureNativeMaxButton(row, availableQuantity, token);' TornScripture-Item-Market-Margin.user.js
          grep -F 'function fillPricedTradeMax' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'function markTraderAvoid' TornScripture-Item-Market-Margin.user.js
          grep -F 'function exactDuplicateLedgerPairs' TornScripture-Item-Market-Margin.user.js
          grep -F 'function ledgerFundingSummary' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          if grep -Fq 'tsimm-priced-trade-max' TornScripture-Item-Market-Margin.user.js; then
            echo 'Legacy badge-embedded MAX remains' >&2
            exit 1
          fi

      - name: Commit clean release to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            scripts/apply_imm_v0198_trade_picker_stability.py \
            scripts/trigger_imm_v0198_trade_picker_stability.txt \
            .github/workflows/apply-imm-v0198-trade-picker-stability.yml
          git commit -m 'Stabilize trade badges and place MAX beside Qty'
          git push origin main
