name: PR release GOBLIN GOD v0.18.2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/trigger_imm_v0182.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply best-trader feature
        run: python scripts/apply_imm_v0182_best_trader_match.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate top-match badges and protected systems
        shell: bash
        run: |
          set -euo pipefail
          FILE=TornScripture-Item-Market-Margin.user.js
          grep -q '@version      0.18.2' "$FILE"
          grep -q 'function pricedTradeBestTraderQuote(item, currentTrader)' "$FILE"
          grep -q 'function pricedTradeBestMatchHtml(bestMatch, currentTrader, currentQuote, projection)' "$FILE"
          grep -q '★ TOP MATCH' "$FILE"
          grep -q '↑ BEST' "$FILE"
          grep -q 'tradeExitFavoriteRefs' "$FILE"
          grep -q 'quickMaxOverrideArmed' "$FILE"
          grep -q 'Outside an explicitly armed Override MAX action' "$FILE"
          grep -q 'buildTradeExitAudit' "$FILE"
          grep -q 'inventoryBaseline' "$FILE"
          grep -q 'sellPriority' "$FILE"

      - name: Commit clean feature to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0182_best_trader_match.py .github/workflows/apply-imm-v0182-best-trader.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0182.txt
          git commit -m 'Add best-trader match badges in GOBLIN GOD v0.18.2'
          git push origin main
