name: PR release GOBLIN GOD v0.15.0

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: imm-v0150-pr-release
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'imm-v0150-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused release
        run: python scripts/apply_imm_v0150_turnover_watchlists.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate turnover library and protected systems
        shell: bash
        run: |
          grep -q '@version      0.15.0' TornScripture-Item-Market-Margin.user.js
          grep -q 'const HIGH_TURNOVER_PRESETS = Object.freeze' TornScripture-Item-Market-Margin.user.js
          grep -q "id: 'war-recovery'" TornScripture-Item-Market-Margin.user.js
          grep -q "id: 'combat-temps'" TornScripture-Item-Market-Margin.user.js
          grep -q "id: 'museum-sets'" TornScripture-Item-Market-Margin.user.js
          grep -q "id: 'energy-gym'" TornScripture-Item-Market-Margin.user.js
          grep -q 'function addTurnoverPreset' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-watch-turnover-preset' TornScripture-Item-Market-Margin.user.js
          grep -q 'function watchEntryMatchesItem' TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q 'function setCurrentInventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -q 'function sellPriorityAllowsSelling' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit clean release to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0150_turnover_watchlists.py scripts/trigger_imm_v0150.txt .github/workflows/apply-imm-v0150-turnover-watchlists.yml .github/workflows/apply-imm-v0150-pr-release.yml
          git commit -m 'Add high-turnover target library in GOBLIN GOD v0.15.0'
          git push origin HEAD:main
