name: PR release GOBLIN GOD v0.17.4

on:
  pull_request:
    paths:
      - scripts/trigger_imm_v0174.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply focused hotfix
        run: python scripts/apply_imm_v0174_tornpda_qty_controls.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate TornPDA Qty rows and protected systems
        run: |
          grep -q '@version      0.17.4' TornScripture-Item-Market-Margin.user.js
          grep -q 'function pricedTradeControlElements' TornScripture-Item-Market-Margin.user.js
          grep -q '\[class\*="qty" i\]' TornScripture-Item-Market-Margin.user.js
          grep -q "if (/\^qty\$/i.test(normalizeWhitespace(ownText(control) || control.textContent))) return true;" TornScripture-Item-Market-Margin.user.js
          grep -q 'if (singleControl) return 1;' TornScripture-Item-Market-Margin.user.js
          grep -q 'Quick MAX can fill Torn' TornScripture-Item-Market-Margin.user.js
          grep -q 'Override MAX can submit only after' TornScripture-Item-Market-Margin.user.js
          grep -q 'inventory baseline' TornScripture-Item-Market-Margin.user.js
          grep -q 'sell-priority' TornScripture-Item-Market-Margin.user.js
          grep -q 'Outside an explicitly armed Override MAX action' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean hotfix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0174_tornpda_qty_controls.py .github/workflows/apply-imm-v0174-tornpda-qty-controls.yml
          git commit -m 'Recognize TornPDA Qty rows in priced trades v0.17.4'
          git push origin main
