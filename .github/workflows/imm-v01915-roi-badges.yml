# Retry trigger after workflow registration
name: IMM v0.19.15 ROI-first badges

on:
  push:
    branches:
      - repair/imm-v0.19.15-roi-first-badges
    paths:
      - .github/workflows/imm-v01915-roi-badges.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Bootstrap IMM v0.19.15 ROI badge repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch ROI-first badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('TornScripture-Item-Market-Margin.user.js')
          text = path.read_text(encoding='utf-8')

          old_version_count = text.count('0.19.14')
          if old_version_count < 4:
              raise SystemExit(f'Expected current 0.19.14 markers, found {old_version_count}')
          text = text.replace('0.19.14', '0.19.15')

          old_badge_css = '''      .tsimm-watch-inline-badge{display:grid!important;gap:1px!important;min-width:0!important;max-width:100%!important;padding:2px 4px!important;overflow:hidden!important;box-sizing:border-box!important}.tsimm-watch-inline-badge strong,.tsimm-watch-inline-badge .tsimm-listing-lot{display:block!important;min-width:0!important;max-width:100%!important;overflow:hidden!important;white-space:nowrap!important;text-overflow:clip!important}.tsimm-watch-inline-badge strong{font:800 8px/1.05 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important}.tsimm-watch-inline-badge .tsimm-listing-lot{font:800 7px/1.05 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important}.tsimm-watch-inline{display:none!important}.tsimm-watch-inline-badge.tsimm-watch-best-exit-profit,.tsimm-watch-inline-badge.tsimm-watch-best-exit-profit strong,.tsimm-watch-inline-badge.tsimm-watch-best-exit-profit .tsimm-listing-lot{border-color:#78ef8d!important;background:#073411f5!important;color:#78ef8d!important}.tsimm-watch-inline-badge.tsimm-watch-best-exit-even,.tsimm-watch-inline-badge.tsimm-watch-best-exit-even strong,.tsimm-watch-inline-badge.tsimm-watch-best-exit-even .tsimm-listing-lot,.tsimm-watch-inline-badge.tsimm-watch-floor-badge,.tsimm-watch-inline-badge.tsimm-watch-floor-badge strong,.tsimm-watch-inline-badge.tsimm-watch-floor-badge .tsimm-listing-lot{border-color:#52c7ea!important;background:#071f29f5!important;color:#8ee8ff!important}.tsimm-watch-hidden-loss{display:none!important}.tsimm-watch-format-row{position:relative!important}'''
          new_badge_css = '''      .tsimm-watch-inline-badge{display:grid!important;gap:1px!important;min-width:0!important;max-width:100%!important;padding:2px 4px!important;overflow:hidden!important;box-sizing:border-box!important}.tsimm-watch-inline-badge strong,.tsimm-watch-inline-badge .tsimm-listing-lot{display:block!important;min-width:0!important;max-width:100%!important;overflow:hidden!important;white-space:nowrap!important;text-overflow:clip!important}.tsimm-watch-inline-badge strong{font:800 8px/1.05 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important}.tsimm-watch-inline-badge .tsimm-listing-lot{font:800 7px/1.05 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important}.tsimm-watch-inline{display:none!important}.tsimm-watch-inline-badge.tsimm-watch-roi-gold,.tsimm-watch-inline-badge.tsimm-watch-roi-gold strong,.tsimm-watch-inline-badge.tsimm-watch-roi-gold .tsimm-listing-lot{border-color:#f4c95d!important;background:#2b2208f5!important;color:#ffe38a!important}.tsimm-watch-inline-badge.tsimm-watch-roi-green,.tsimm-watch-inline-badge.tsimm-watch-roi-green strong,.tsimm-watch-inline-badge.tsimm-watch-roi-green .tsimm-listing-lot{border-color:#78ef8d!important;background:#073411f5!important;color:#78ef8d!important}.tsimm-watch-inline-badge.tsimm-watch-roi-purple,.tsimm-watch-inline-badge.tsimm-watch-roi-purple strong,.tsimm-watch-inline-badge.tsimm-watch-roi-purple .tsimm-listing-lot{border-color:#c77dff!important;background:#281037f5!important;color:#dca2ff!important}.tsimm-watch-inline-badge.tsimm-watch-roi-even,.tsimm-watch-inline-badge.tsimm-watch-roi-even strong,.tsimm-watch-inline-badge.tsimm-watch-roi-even .tsimm-listing-lot{border-color:#52c7ea!important;background:#071f29f5!important;color:#8ee8ff!important}.tsimm-watch-inline-badge.tsimm-watch-roi-loss,.tsimm-watch-inline-badge.tsimm-watch-roi-loss strong,.tsimm-watch-inline-badge.tsimm-watch-roi-loss .tsimm-listing-lot{border-color:#ff626d!important;background:#2c0b0ef5!important;color:#ff8c96!important}.tsimm-watch-format-row{position:relative!important}'''
          if text.count(old_badge_css) != 1:
              raise SystemExit('ROI badge CSS anchor did not match exactly once')
          text = text.replace(old_badge_css, new_badge_css)

          old_profit_css = '''      .tsimm-watch-profit{position:absolute!important;right:clamp(72px,20%,148px)!important;top:50%!important;z-index:12!important;display:inline-flex!important;align-items:center!important;width:max-content!important;max-width:112px!important;margin:0!important;padding:2px 5px!important;transform:translateY(-50%)!important;border:1px solid #42b95a!important;border-radius:4px!important;background:#07230df2!important;color:#baff9f!important;font:800 8px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;white-space:nowrap!important;pointer-events:none!important;box-sizing:border-box!important}.tsimm-watch-profit.flip{border-color:#78ef8d!important;background:#073411f5!important;color:#d1ffbf!important}.tsimm-watch-profit.floor{border-color:#52c7ea!important;background:#071f29f5!important;color:#8ee8ff!important}.tsimm-watch-profitable{box-shadow:inset 2px 0 #58df78!important}.tsimm-watch-floor-row{box-shadow:inset 0 2px #52c7ea!important}'''
          new_profit_css = '''      .tsimm-watch-profit{position:absolute!important;right:clamp(72px,20%,148px)!important;top:50%!important;z-index:12!important;display:inline-flex!important;align-items:center!important;width:max-content!important;max-width:126px!important;margin:0!important;padding:2px 5px!important;transform:translateY(-50%)!important;border:1px solid #66717a!important;border-radius:4px!important;background:#171b1df2!important;color:#d9e0e3!important;font:800 8px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;white-space:nowrap!important;pointer-events:none!important;box-sizing:border-box!important}.tsimm-watch-profit.tsimm-watch-roi-gold{border-color:#f4c95d!important;background:#2b2208f5!important;color:#ffe38a!important}.tsimm-watch-profit.tsimm-watch-roi-green{border-color:#78ef8d!important;background:#073411f5!important;color:#78ef8d!important}.tsimm-watch-profit.tsimm-watch-roi-purple{border-color:#c77dff!important;background:#281037f5!important;color:#dca2ff!important}.tsimm-watch-profit.tsimm-watch-roi-even{border-color:#52c7ea!important;background:#071f29f5!important;color:#8ee8ff!important}.tsimm-watch-profit.tsimm-watch-roi-loss{border-color:#ff626d!important;background:#2c0b0ef5!important;color:#ff8c96!important}.tsimm-watch-profitable{box-shadow:inset 2px 0 #58df78!important}.tsimm-watch-floor-row{box-shadow:inset 0 2px #52c7ea!important}'''
          if text.count(old_profit_css) != 1:
              raise SystemExit('Fallback profit CSS anchor did not match exactly once')
          text = text.replace(old_profit_css, new_profit_css)

          old_health_css = '''      .tsimm-market-health-mark{display:flex!important;align-items:center!important;gap:0!important;margin-top:1px!important;padding-top:1px!important;border-top:1px solid #6b6570!important;font:900 6.5px/1.05 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;letter-spacing:.02em!important;opacity:1!important}.tsimm-market-health-mark .mv-gap.discount{color:#78ef8d!important}.tsimm-market-health-mark .mv-gap.aligned{color:#8ee8ff!important}.tsimm-market-health-mark .mv-gap.premium{color:#ff8c96!important}.tsimm-market-health-mark .mv-gap.unknown{color:#aeb8bd!important}.tsimm-market-health-mark .quote-gap.aligned,.tsimm-market-health-summary.aligned{color:#8ee8ff!important}.tsimm-market-health-mark .quote-gap.caution,.tsimm-market-health-summary.caution{color:#ffd166!important}.tsimm-market-health-mark .quote-gap.danger,.tsimm-market-health-summary.danger{color:#ff8c96!important}.tsimm-market-health-mark .quote-gap.unknown,.tsimm-market-health-summary.unknown{color:#aeb8bd!important}.tsimm-market-health-aligned-row{box-shadow:inset 3px 0 #52c7ea!important}.tsimm-market-health-caution-row{box-shadow:inset 3px 0 #d7a83d!important}.tsimm-market-health-danger-row{box-shadow:inset 3px 0 #df5966!important}.tsimm-market-health-unknown-row{box-shadow:inset 3px 0 #66717a!important}#${A.panel}.health-caution{border-color:#9a6d1f!important}#${A.panel}.health-danger{border-color:#8f4850!important}#${A.panel}.health-aligned{border-color:#318cab!important}'''
          new_health_css = '''      .tsimm-market-health-summary.aligned{color:#8ee8ff!important}.tsimm-market-health-summary.caution{color:#ffd166!important}.tsimm-market-health-summary.danger{color:#ff8c96!important}.tsimm-market-health-summary.unknown{color:#aeb8bd!important}.tsimm-market-health-aligned-row{box-shadow:inset 3px 0 #52c7ea!important}.tsimm-market-health-caution-row{box-shadow:inset 3px 0 #d7a83d!important}.tsimm-market-health-danger-row{box-shadow:inset 3px 0 #df5966!important}.tsimm-market-health-unknown-row{box-shadow:inset 3px 0 #66717a!important}#${A.panel}.health-caution{border-color:#9a6d1f!important}#${A.panel}.health-danger{border-color:#8f4850!important}#${A.panel}.health-aligned{border-color:#318cab!important}'''
          if text.count(old_health_css) != 1:
              raise SystemExit('Market-health CSS anchor did not match exactly once')
          text = text.replace(old_health_css, new_health_css)

          old_health_function = '''  function addMarketHealthMarker(row, health) {
    if (!(row instanceof Element)) return;
    const badge = row.querySelector('.tsimm-margin-badge.tsimm-badge-listing');
    const price = listingPrice(row);
    const listingGap = price > 0 && health.marketValue > 0
      ? (price - health.marketValue) / health.marketValue * 100
      : null;
    row.classList.remove(
      'tsimm-market-health-aligned-row', 'tsimm-market-health-caution-row',
      'tsimm-market-health-danger-row', 'tsimm-market-health-unknown-row',
    );
    row.classList.add(`tsimm-market-health-${health.level}-row`);
    if (!badge) return;
    badge.querySelector('[data-tsimm-market-health]')?.remove();
    const marker = document.createElement('span');
    marker.dataset.tsimmMarketHealth = '1';
    marker.className = 'tsimm-market-health-mark';
    const mvLevel = !Number.isFinite(listingGap)
      ? 'unknown'
      : listingGap <= -0.5
        ? 'discount'
        : listingGap >= 0.5
          ? 'premium'
          : 'aligned';
    const mvText = `Ⓜ ${signedMarketPercent(listingGap)} MV`;
    const quoteText = Number.isFinite(health.quoteGap) ? `Q ${signedMarketPercent(health.quoteGap)}` : '';
    marker.innerHTML = `<span class="mv-gap ${mvLevel}">${esc(mvText)}</span>`
      + (quoteText ? `<span class="quote-gap ${health.level}"> · ${esc(quoteText)}</span>` : '');
    marker.title = [
      health.label,
      health.livePrice > 0 ? `Live floor ${cash(health.livePrice)}` : '',
      health.marketValue > 0 ? `Torn Market Value ${cash(health.marketValue)}` : '',
      Number(health.best?.price) > 0 ? `${health.best.traderName} ${cash(health.best.price)} (${health.best.status})` : '',
      health.velocity?.label ? `Velocity ${health.velocity.label}` : '',
    ].filter(Boolean).join(' · ');
    badge.appendChild(marker);
  }'''
          new_health_function = '''  function addMarketHealthMarker(row, health) {
    if (!(row instanceof Element)) return;
    row.classList.remove(
      'tsimm-market-health-aligned-row', 'tsimm-market-health-caution-row',
      'tsimm-market-health-danger-row', 'tsimm-market-health-unknown-row',
    );
    row.classList.add(`tsimm-market-health-${health.level}-row`);
    row.querySelector('[data-tsimm-market-health]')?.remove();
  }'''
          if text.count(old_health_function) != 1:
              raise SystemExit('Market-health marker function anchor did not match exactly once')
          text = text.replace(old_health_function, new_health_function)

          old_profit_function = '''  function addProfitMarker(row, traderProfit, traderName = '', breakEvenPrice = 0, isFloor = false) {
    const badge = row.querySelector('.tsimm-margin-badge.tsimm-badge-listing')
      || row.querySelector('.tsimm-margin-badge');
    const profitEach = Number(traderProfit);
    if (!Number.isFinite(profitEach)) return false;
    const traderLabel = clean(traderName).slice(0, 18) || 'trader';
    const signedCash = (value) => value > 0 ? `+${cash(value)}` : cash(value);

    if (profitEach < 0 && !isFloor) {
      badge?.classList.add('tsimm-watch-hidden-loss');
      row.classList.remove('tsimm-watch-profitable');
      return true;
    }

    if (badge) {
      if (!badge.dataset.tsimmWatchOriginalHtml) badge.dataset.tsimmWatchOriginalHtml = badge.innerHTML;
      const quantity = Math.max(1, Math.floor(Number(badge.dataset.tsimmQuantity) || 1));
      const totalProfit = profitEach * quantity;
      if (profitEach < 0 && isFloor) {
        badge.innerHTML = '<strong>BREAK-EVEN LIMIT</strong>'
          + `<span class="tsimm-listing-lot">${esc(cash(breakEvenPrice))} exit</span>`;
      } else {
        const eachText = profitEach === 0 ? '$0 EVEN' : `${signedCash(profitEach)} ea`;
        const lotText = totalProfit === 0 ? 'lot $0' : `lot ${compactWatchCash(totalProfit)}`;
        badge.innerHTML = `<strong>${esc(eachText)}</strong>`
          + `<span class="tsimm-listing-lot">${esc(lotText)}</span>`;
      }
      badge.classList.remove(
        'tsimm-tier-npc', 'tsimm-tier-gold', 'tsimm-tier-good', 'tsimm-tier-minor', 'tsimm-tier-loss',
        'tsimm-watch-best-exit-profit', 'tsimm-watch-best-exit-even', 'tsimm-watch-best-exit-loss',
        'tsimm-watch-floor-badge', 'tsimm-watch-hidden-loss',
      );
      badge.classList.add('tsimm-watch-inline-badge', 'tsimm-watch-best-exit');
      if (profitEach > 0) badge.classList.add('tsimm-watch-best-exit-profit');
      else if (profitEach === 0) badge.classList.add('tsimm-watch-best-exit-even');
      else badge.classList.add('tsimm-watch-floor-badge');
      badge.title = profitEach < 0 && isFloor
        ? `Break-even limit from ${traderLabel}: ${cash(breakEvenPrice)}`
        : `${traderLabel} best exit`;
      row.classList.toggle('tsimm-watch-profitable', profitEach > 0);
      return true;
    }

    if (profitEach < 0 && !isFloor) return true;
    const marker = document.createElement('span');
    marker.className = `tsimm-watch-profit${profitEach > 0 ? ' flip' : ''}${isFloor ? ' floor' : ''}`;
    marker.dataset.tsimmWatchProfit = '1';
    marker.textContent = profitEach < 0 && isFloor
      ? `BREAK-EVEN LIMIT ${cash(breakEvenPrice)}`
      : profitEach === 0
        ? '$0 EVEN'
        : `${compactWatchCash(profitEach)} ea`;
    marker.title = profitEach < 0 && isFloor
      ? `Break-even limit from ${traderLabel}: ${cash(breakEvenPrice)}`
      : `${traderLabel} best exit`;
    row.appendChild(marker);
    row.classList.add('tsimm-watch-format-row');
    row.classList.toggle('tsimm-watch-profitable', profitEach > 0);
    return true;
  }'''
          new_profit_function = '''  function addProfitMarker(row, traderProfit, traderName = '', breakEvenPrice = 0, isFloor = false) {
    const badge = row.querySelector('.tsimm-margin-badge.tsimm-badge-listing')
      || row.querySelector('.tsimm-margin-badge');
    const profitEach = Number(traderProfit);
    if (!Number.isFinite(profitEach)) return false;
    const traderLabel = clean(traderName).slice(0, 18) || 'trader';
    const signedCash = (value) => value > 0 ? `+${cash(value)}` : cash(value);
    const entryPrice = Math.max(0, Number(badge?.dataset?.tsimmListingPrice) || listingPrice(row) || 0);
    const roiPercent = entryPrice > 0 ? profitEach / entryPrice * 100 : 0;
    const roiClass = profitEach < 0
      ? 'tsimm-watch-roi-loss'
      : profitEach === 0
        ? 'tsimm-watch-roi-even'
        : roiPercent >= 4
          ? 'tsimm-watch-roi-gold'
          : roiPercent >= 2.5
            ? 'tsimm-watch-roi-green'
            : 'tsimm-watch-roi-purple';
    const roiText = entryPrice > 0 ? `${roiPercent.toFixed(2)}%` : 'ROI —';
    const exitPrice = breakEvenPrice > 0 ? breakEvenPrice : Math.max(0, entryPrice + profitEach);

    if (badge) {
      if (!badge.dataset.tsimmWatchOriginalHtml) badge.dataset.tsimmWatchOriginalHtml = badge.innerHTML;
      const quantity = Math.max(1, Math.floor(Number(badge.dataset.tsimmQuantity) || 1));
      const totalProfit = profitEach * quantity;
      const eachText = profitEach === 0 ? '$0 ea' : `${signedCash(profitEach)} ea`;
      const lotText = totalProfit === 0 ? 'lot $0' : `lot ${compactWatchCash(totalProfit)}`;
      badge.innerHTML = `<strong>${esc(eachText)} · ${esc(roiText)}</strong>`
        + `<span class="tsimm-listing-lot">${esc(lotText)}</span>`;
      badge.classList.remove(
        'tsimm-tier-npc', 'tsimm-tier-gold', 'tsimm-tier-good', 'tsimm-tier-minor', 'tsimm-tier-loss',
        'tsimm-watch-best-exit-profit', 'tsimm-watch-best-exit-even', 'tsimm-watch-best-exit-loss',
        'tsimm-watch-floor-badge', 'tsimm-watch-hidden-loss',
        'tsimm-watch-roi-gold', 'tsimm-watch-roi-green', 'tsimm-watch-roi-purple',
        'tsimm-watch-roi-even', 'tsimm-watch-roi-loss',
      );
      badge.classList.add('tsimm-watch-inline-badge', 'tsimm-watch-best-exit', roiClass);
      badge.title = `${traderLabel} exit ${cash(exitPrice)} · buy ${cash(entryPrice)} · ${roiText} ROI${isFloor ? ' · first row at or below the exit' : ''}`;
      row.classList.toggle('tsimm-watch-profitable', profitEach > 0);
      return true;
    }

    const marker = document.createElement('span');
    marker.className = `tsimm-watch-profit ${roiClass}`;
    marker.dataset.tsimmWatchProfit = '1';
    marker.textContent = `${profitEach === 0 ? '$0 ea' : `${signedCash(profitEach)} ea`} · ${roiText}`;
    marker.title = `${traderLabel} exit ${cash(exitPrice)} · buy ${cash(entryPrice)} · ${roiText} ROI${isFloor ? ' · first row at or below the exit' : ''}`;
    row.appendChild(marker);
    row.classList.add('tsimm-watch-format-row');
    row.classList.toggle('tsimm-watch-profitable', profitEach > 0);
    return true;
  }'''
          if text.count(old_profit_function) != 1:
              raise SystemExit('Profit-marker function anchor did not match exactly once')
          text = text.replace(old_profit_function, new_profit_function)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and ROI semantics
        shell: bash
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          git diff --check
          python - <<'PY'
          from pathlib import Path

          text = Path('TornScripture-Item-Market-Margin.user.js').read_text(encoding='utf-8')
          required = [
              '// @version      0.19.15',
              "version: '0.19.15'",
              'tsimm-watch-roi-gold',
              'tsimm-watch-roi-green',
              'tsimm-watch-roi-purple',
              'tsimm-watch-roi-even',
              'tsimm-watch-roi-loss',
              'profitEach / entryPrice * 100',
              '${esc(eachText)} · ${esc(roiText)}',
              'applyMarketHealthPanel(health)',
              'tsimm-market-health-danger-row',
              'savePendingTradeSaleFromStats',
              'pricedTradeEnsureNativeMaxButton',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing guarded tokens: {missing}')
          if '0.19.14' in text:
              raise SystemExit('Old version marker remains')
          if 'BREAK-EVEN LIMIT' in text[text.find('function addProfitMarker('):text.find('function validWatchListingRow(')]:
              raise SystemExit('Old floor badge still overrides ROI output')

          def tier(entry, exit_price):
              profit = exit_price - entry
              roi = profit / entry * 100
              if profit < 0:
                  return 'loss'
              if profit == 0:
                  return 'even'
              if roi >= 4:
                  return 'gold'
              if roi >= 2.5:
                  return 'green'
              return 'purple'

          checks = [
              (994, 1037, 'gold'),
              (1000, 1037, 'green'),
              (479, 484, 'purple'),
              (484, 484, 'even'),
              (1050, 1037, 'loss'),
          ]
          for entry, exit_price, expected in checks:
              actual = tier(entry, exit_price)
              if actual != expected:
                  raise SystemExit(f'ROI tier mismatch: {entry}->{exit_price} expected {expected}, got {actual}')
          print('ROI-first badge validation passed.')
          PY

      - name: Commit repaired userscript
        shell: bash
        run: |
          git config user.name 'TornScripture Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git commit -m 'Make market badges ROI-first'
          git push origin HEAD:${{ github.ref_name }}
