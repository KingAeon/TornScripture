name: Release GOBLIN GOD v0.19.7 static Priced Trade

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/pr_trigger_imm_v0197_static_badges_trade_max.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply, validate, and publish
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_imm_v0197_static_badges_trade_max.py')
          text = path.read_text(encoding='utf-8')
          old = "if 'capturePricedTradeQuantityEvent(event' in text:"
          new = "if 'if (capturePricedTradeQuantityEvent(event' in text:"
          if text.count(old) != 1:
              raise SystemExit('Could not correct the quantity-hook validator exactly once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/apply_imm_v0197_static_badges_trade_max.py
          python scripts/apply_imm_v0197_static_badges_trade_max.py
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.7' TornScripture-Item-Market-Margin.user.js
          grep -F 'static full-stack Priced Trade badges with native MAX filling' TornScripture-Item-Market-Margin.user.js
          grep -F 'data-tsimm-action="priced-trade-max"' TornScripture-Item-Market-Margin.user.js
          grep -F "mode: 'full-stack'" TornScripture-Item-Market-Margin.user.js
          grep -F 'function fillPricedTradeMax' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeSetQuantityControl' TornScripture-Item-Market-Margin.user.js
          grep -F 'handleQuickMaxClick' TornScripture-Item-Market-Margin.user.js
          grep -F 'ledgerSalePlan' TornScripture-Item-Market-Margin.user.js
          if grep -F 'if (capturePricedTradeQuantityEvent(event' TornScripture-Item-Market-Margin.user.js; then
            echo 'Quantity-driven Priced Trade redraw hook is still bound.' >&2
            exit 1
          fi
          if grep -F 'quantityDecision.selected' TornScripture-Item-Market-Margin.user.js; then
            echo 'Selected-quantity badge rendering is still present.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            .github/workflows/release-imm-v0197-static-badges-trade-max.yml \
            .github/workflows/release_imm_v0197_static_badges_trade_max.yml \
            scripts/apply_imm_v0197_static_badges_trade_max.py
          git commit -m 'Make Priced Trade static and add native MAX filling'
          git push origin main
