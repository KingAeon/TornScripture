name: v0.19.36 startup repair

on:
  push:
    branches:
      - agent/v0.19.36-startup-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.19.36-startup-repair
          fetch-depth: 0

      - name: Validate repaired startup state
        shell: python
        run: |
          from pathlib import Path

          path = Path('TornScripture-Item-Market-Margin.user.js')
          text = path.read_text(encoding='utf-8')

          old = "if (!VALID_PERMISSION_STATES.has(st)) return null;"
          new = "if (!['validated', 'insufficient', 'unavailable-or-inconclusive'].includes(st)) return null;"

          if text.count(old) != 0:
              raise SystemExit('SAFETY STOP: startup TDZ dependency still exists')
          if text.count(new) != 1:
              raise SystemExit(f'SAFETY STOP: expected exactly one repaired permission-state check, found {text.count(new)}')
          if text.count('0.19.35') != 0:
              raise SystemExit('SAFETY STOP: stale v0.19.35 marker remains')
          if text.count('0.19.36') != 5:
              raise SystemExit(f'SAFETY STOP: expected exactly five v0.19.36 markers, found {text.count("0.19.36")}')

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD || git diff --check

      - name: Node syntax
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Persisted-permission startup regression
        run: node --test tests/imm-startup-persisted-permission.test.js

      - name: API recovery regression
        run: node --test tests/imm-api-trade-recovery.test.js

      - name: Protected regressions
        run: node --test tests/imm-carousel-zero-price-mismatch.test.js tests/imm-carousel-identity-precedence.test.js tests/inventory-sales-core.test.js
