name: GOBLIN GOD v0.19.2 single-item trader exits

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0192_single_item_traders.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add single-item trader exits
        run: python scripts/apply_imm_v0192_single_item_traders.py

      - name: Validate JavaScript and protected systems
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.2' TornScripture-Item-Market-Margin.user.js
          grep -F 'itemTraderQuoteLimit: 3' TornScripture-Item-Market-Margin.user.js
          grep -F 'function singleItemTraderQuotes(stats = state.lastScan)' TornScripture-Item-Market-Margin.user.js
          grep -F 'function singleItemTraderQuotesHtml(stats = state.lastScan)' TornScripture-Item-Market-Margin.user.js
          grep -F 'Best trader exits' TornScripture-Item-Market-Margin.user.js
          grep -F "action === 'item-trader-quotes-toggle'" TornScripture-Item-Market-Margin.user.js
          grep -F 'stats.listingLowestPrice' TornScripture-Item-Market-Margin.user.js
          grep -F 'traderRecommendationsEligible' TornScripture-Item-Market-Margin.user.js
          grep -F 'function markTraderAvoid(id)' TornScripture-Item-Market-Margin.user.js
          grep -F 'function hideTrader(id)' TornScripture-Item-Market-Margin.user.js
          grep -F 'schedulePricedTradeRowRefresh' TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean release to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            .github/workflows/apply-imm-v0192-single-item-traders.yml \
            scripts/apply_imm_v0192_single_item_traders.py
          git rm --ignore-unmatch \
            scripts/trigger_imm_v0192_single_item_traders.txt \
            scripts/trigger_imm_v0192_single_item_traders_retry.txt \
            scripts/trigger_branch_note.txt
          git commit -m 'Add single-item trader exit rankings'
          git push origin main
