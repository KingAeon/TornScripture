name: Release GOBLIN GOD v0.19.5 funding sources

on:
  push:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0195_funding_sources.txt
  pull_request:
    branches: [main]
    paths:
      - scripts/pr_trigger_imm_v0195_funding_sources.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply, validate, and publish
        run: |
          set -euo pipefail
          sed -i 's/^         <\/div>$/        <\/div>/' scripts/apply_imm_v0195_funding_sources.py
          python scripts/apply_imm_v0195_funding_sources.py
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.5' TornScripture-Item-Market-Margin.user.js
          grep -F "ledgerDefaultFundingSource: 'personal'" TornScripture-Item-Market-Margin.user.js
          grep -F "function ledgerFundingSummary()" TornScripture-Item-Market-Margin.user.js
          grep -F "data-tsimm-action=\"ledger-assign-unassigned\"" TornScripture-Item-Market-Margin.user.js
          grep -F "data-tsimm-ledger-funding-filter" TornScripture-Item-Market-Margin.user.js
          grep -F "schema v5" TornScripture-Item-Market-Margin.user.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            .github/workflows/release-imm-v0195-funding-sources.yml \
            scripts/apply_imm_v0195_funding_sources.py \
            scripts/trigger_imm_v0195_funding_sources.txt
          git commit -m 'Track ledger funding sources'
          git push origin main
