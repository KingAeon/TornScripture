name: Apply GOBLIN GOD v0.14.0 baseline and sell priority

on:
  push:
    paths:
      - scripts/apply_imm_v0140_baseline_sell_priority.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused release
        run: python scripts/apply_imm_v0140_baseline_sell_priority.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate baseline, sell priority, fallback, and protected systems
        shell: bash
        run: |
          grep -q '@version      0.14.0' TornScripture-Item-Market-Margin.user.js
          grep -q 'const INVENTORY_API_CATEGORIES = Object.freeze' TornScripture-Item-Market-Margin.user.js
          grep -q 'function setCurrentInventoryBaseline()' TornScripture-Item-Market-Margin.user.js
          grep -q 'function sellPriorityAllowsSelling(candidate)' TornScripture-Item-Market-Margin.user.js
          grep -q 'tornscripture-imm-sell-priority-v1' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-action="sell-priority-set"' TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q "brandName: 'GOBLIN GOD'" TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit release and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0140_baseline_sell_priority.py .github/workflows/apply-imm-v0140-baseline-sell-priority.yml
          git commit -m 'Add inventory baseline and persistent sell priority in GOBLIN GOD v0.14.0'
          git push
