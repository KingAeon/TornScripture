name: Release IMM v0.19.15 ROI-first badges

on:
  push:
    branches: [main]
    paths:
      - .github/imm-v01915-trigger-main.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply guarded ROI-first patch
        run: python scripts/apply_imm_v01915_roi_first.py

      - name: Validate JavaScript and protected systems
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          git diff --check
          grep -F '// @version      0.19.15' TornScripture-Item-Market-Margin.user.js
          grep -F 'profitEach / entryPrice * 100' TornScripture-Item-Market-Margin.user.js
          grep -F 'tsimm-watch-roi-gold' TornScripture-Item-Market-Margin.user.js
          grep -F 'tsimm-watch-roi-green' TornScripture-Item-Market-Margin.user.js
          grep -F 'tsimm-watch-roi-purple' TornScripture-Item-Market-Margin.user.js
          grep -F 'tsimm-watch-roi-even' TornScripture-Item-Market-Margin.user.js
          grep -F 'tsimm-watch-roi-loss' TornScripture-Item-Market-Margin.user.js
          grep -F 'function recordTradeSale' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeRenderRowBadge' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeEnsureNativeMaxButton' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean release to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            scripts/apply_imm_v01915_roi_first.py \
            .github/imm-v01915-trigger-main.txt \
            .github/workflows/imm-v01915-self-contained.yml
          git commit -m 'Release IMM v0.19.15 ROI-first badges'
          git push origin main
