name: PR release GOBLIN GOD v0.18.4

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0184.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply persistent repaint hotfix
        run: python scripts/apply_imm_v0184_persistent_repaint.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate persistent repaint and protected systems
        run: |
          grep -F '// @version      0.18.4' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradePickerObserver.observe(document.body' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeMutationTouchesPicker' TornScripture-Item-Market-Margin.user.js
          grep -F "document.addEventListener('click', capturePricedTradePickerInteraction, true);" TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean hotfix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0184_persistent_repaint.py .github/workflows/apply-imm-v0184-pr-release.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0184.txt
          git commit -m 'Keep Priced Trade repaint alive across category swaps'
          git push origin main
