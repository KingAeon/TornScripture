name: Apply IMM v0.12.2 listing containment fix

on:
  push:
    paths:
      - scripts/apply_imm_v0122.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused patch
        run: python scripts/apply_imm_v0122.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate containment
        run: |
          grep -q '@version      0.12.2' TornScripture-Item-Market-Margin.user.js
          grep -q 'function validWatchListingRow(row)' TornScripture-Item-Market-Margin.user.js
          grep -q "row.querySelector('\[data-tsimm-quick-max\]')" TornScripture-Item-Market-Margin.user.js
          grep -q '.filter(validWatchListingRow)' TornScripture-Item-Market-Margin.user.js
          grep -q "brandName: 'GOBLIN GOD'" TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit release and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0122.py .github/workflows/apply-imm-v0122.yml .github/workflows/imm-v0.12.2-listing-row-containment.yml .github/imm-v0.12.2-trigger.txt
          git commit -m "Contain watched listing badges in IMM v0.12.2"
          git push
