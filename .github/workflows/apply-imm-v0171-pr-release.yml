name: PR release GOBLIN GOD v0.17.1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: imm-v0171-pr-release
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'imm-v0171-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: release-patch
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused hotfix
        working-directory: main
        run: python ../release-patch/scripts/apply_imm_v0171_priced_trade_qty_hotfix.py
      - name: Validate JavaScript
        working-directory: main
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate TornPDA priced trade hotfix and protected systems
        working-directory: main
        shell: bash
        run: |
          grep -q '@version      0.17.1' TornScripture-Item-Market-Margin.user.js
          grep -q 'function pricedTradeInventorySurface' TornScripture-Item-Market-Margin.user.js
          grep -q "add|select|choose|include|qty|quantity" TornScripture-Item-Market-Margin.user.js
          grep -q "inventorySurface.prepend(panel)" TornScripture-Item-Market-Margin.user.js
          grep -q "if (sameTrade && loadPricedTradeSession()) applyPricedTradeInventoryBadges(previous);" TornScripture-Item-Market-Margin.user.js
          grep -q 'function pricedTradeVerification' TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q 'function setCurrentInventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -q 'function sellPriorityAllowsSelling' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit clean hotfix to main
        working-directory: main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0171_priced_trade_qty_hotfix.py .github/workflows/apply-imm-v0171-pr-release.yml
          git commit -m 'Fix TornPDA Qty rows in GOBLIN GOD v0.17.1'
          git push origin HEAD:main
