name: PR release GOBLIN GOD v0.18.5

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0185.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply quantity-reactive FIFO feature
        run: python scripts/apply_imm_v0185_quantity_reactive.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate quantity reactions and protected systems
        run: |
          grep -F '// @version      0.18.5' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeSelectedQuantity' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeQuantityDecision' TornScripture-Item-Market-Margin.user.js
          grep -F 'AVAILABLE PREVIEW' TornScripture-Item-Market-Margin.user.js
          grep -F 'SELECTED' TornScripture-Item-Market-Margin.user.js
          grep -F 'lotsUsed' TornScripture-Item-Market-Margin.user.js
          grep -F 'lots blended' TornScripture-Item-Market-Margin.user.js
          grep -F "document.addEventListener('input', capturePricedTradePickerInteraction, true);" TornScripture-Item-Market-Margin.user.js
          grep -F "document.addEventListener('change', capturePricedTradePickerInteraction, true);" TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradePickerObserver.observe(document.body' TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean feature to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0185_quantity_reactive.py .github/workflows/apply-imm-v0185-pr-release.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0185.txt
          git commit -m 'Recalculate Priced Trade profit from selected quantities'
          git push origin main
