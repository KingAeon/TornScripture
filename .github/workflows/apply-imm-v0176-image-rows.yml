name: PR release GOBLIN GOD v0.17.6

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/trigger_imm_v0176.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply focused hotfix
        run: python scripts/apply_imm_v0176_image_rows.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate image rows and protected systems
        shell: bash
        run: |
          set -euo pipefail
          FILE=TornScripture-Item-Market-Margin.user.js
          grep -q '@version      0.17.6' "$FILE"
          grep -q 'function pricedTradeRowForItemImage(image, trader)' "$FILE"
          grep -q 'const surface = pricedTradeInventorySurface() || document;' "$FILE"
          grep -q 'const active = Boolean(hasPickerText && hasAddText);' "$FILE"
          grep -q "row.querySelectorAll('img')" "$FILE"
          grep -q 'quickMaxOverrideArmed' "$FILE"
          grep -q 'Outside an explicitly armed Override MAX action' "$FILE"
          grep -q 'buildTradeExitAudit' "$FILE"
          grep -q 'sellPriority' "$FILE"

      - name: Commit clean hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0176_image_rows.py .github/workflows/apply-imm-v0176-image-rows.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0176.txt
          git commit -m 'Fix TornPDA image rows in GOBLIN GOD v0.17.6'
          git push origin main
