name: Apply GOBLIN GOD v0.18.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply category repaint feature
        run: python scripts/apply_imm_v0183_category_repaint.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate repaint feature and protected systems
        shell: bash
        run: |
          set -euo pipefail
          FILE=TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.18.3' "$FILE"
          grep -F 'function schedulePricedTradePickerRepaint' "$FILE"
          grep -F 'function syncPricedTradePickerObserver' "$FILE"
          grep -F 'function capturePricedTradePickerInteraction' "$FILE"
          grep -F "document.addEventListener('click', capturePricedTradePickerInteraction, true)" "$FILE"
          grep -F 'pricedTradePickerObserver.observe(pricedTradeObservedSurface' "$FILE"
          grep -F 'function handleQuickMaxClick' "$FILE"
          grep -F 'quickMaxOverrideArmed' "$FILE"
          grep -F 'function ledgerSalePlan' "$FILE"
          grep -F 'function buildTradeExitAudit' "$FILE"
          grep -F 'function setCurrentInventoryBaseline' "$FILE"
          grep -F 'function sellPriorityStatus' "$FILE"
          grep -F 'function pricedTradeBestTraderQuote' "$FILE"
          grep -F 'function pricedTradeLedgerProjection' "$FILE"
          ! grep -F '0.18.2' "$FILE"

      - name: Commit clean feature to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0183_category_repaint.py .github/workflows/apply-imm-v0183-category-repaint.yml .github/workflows/apply-imm-v0183-pr-release.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0183.txt
          git commit -m 'Auto-repaint Priced Trade categories in GOBLIN GOD v0.18.3'
          git push origin HEAD:main
