name: PR release GOBLIN GOD v0.17.3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: imm-v0173-pr-release
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'imm-v0173-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused hotfix
        run: python scripts/apply_imm_v0173_picker_detector.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate resilient picker detector and protected systems
        shell: bash
        run: |
          grep -q '@version      0.17.3' TornScripture-Item-Market-Margin.user.js
          grep -q 'function pricedTradePickerEvidence' TornScripture-Item-Market-Margin.user.js
          grep -q 'picker.active && recentHandoff && tornHost' TornScripture-Item-Market-Margin.user.js
          grep -q 'which items would you like to add to trade' TornScripture-Item-Market-Margin.user.js
          grep -q 'add\\s+to\\s+trade' TornScripture-Item-Market-Margin.user.js
          grep -q 'function pricedTradeCandidateRows' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q 'function setCurrentInventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -q 'function sellPriorityAllowsSelling' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit clean hotfix to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm scripts/apply_imm_v0173_picker_detector.py .github/workflows/apply-imm-v0173-pr-release.yml
          git commit -m 'Fix TornPDA priced trade picker detection in v0.17.3'
          git push origin HEAD:main
