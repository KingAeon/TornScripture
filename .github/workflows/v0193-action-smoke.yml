name: v0.19.3 action smoke

on:
  push:
    branches: [main]
    paths:
      - scripts/ping_v0193.txt

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit smoke marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'action ran\n' > scripts/pong_v0193.txt
          git add scripts/pong_v0193.txt
          git commit -m 'Confirm v0.19.3 action trigger'
          git push origin main
