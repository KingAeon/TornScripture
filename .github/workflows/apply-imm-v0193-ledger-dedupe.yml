name: Release GOBLIN GOD v0.19.3 ledger dedupe

on:
  push:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0193_ledger_dedupe.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply, validate, and publish
        run: |
          set +e
          python scripts/apply_imm_v0193_ledger_dedupe.py > scripts/v0193-release-diagnostic.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            node --check TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            grep -F '// @version      0.19.3' TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1 || code=$?
            grep -F "function purchaseFingerprint(parsed, itemId = itemIdFromLocation())" TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1 || code=$?
            grep -F "recordPurchaseSignal('duplicate-suppressed'" TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1 || code=$?
            grep -F "function pricedTradeBestTraderQuote" TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1 || code=$?
            grep -F "function markTraderAvoid" TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1 || code=$?
            grep -F "buildTradeExitAudit" TornScripture-Item-Market-Margin.user.js >> scripts/v0193-release-diagnostic.txt 2>&1 || code=$?
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$code" -eq 0 ]; then
            git add TornScripture-Item-Market-Margin.user.js
            git rm -f \
              .github/workflows/apply-imm-v0193-ledger-dedupe.yml \
              .github/workflows/v0193-action-smoke.yml \
              scripts/apply_imm_v0193_ledger_dedupe.py \
              scripts/trigger_imm_v0193_ledger_dedupe.txt \
              scripts/ping_v0193.txt \
              scripts/pong_v0193.txt
            git rm --ignore-unmatch scripts/v0193-release-diagnostic.txt
            git commit -m 'Prevent duplicate purchase ledger captures'
          else
            printf '\nEXIT_CODE=%s\n' "$code" >> scripts/v0193-release-diagnostic.txt
            git add scripts/v0193-release-diagnostic.txt
            git commit -m 'Record v0.19.3 release diagnostic'
          fi

          git push origin main
          exit "$code"
