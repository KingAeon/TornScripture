name: PR release GOBLIN GOD v0.18.9

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0189.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply scroll-quiet feature
        run: python scripts/apply_imm_v0189_scroll_quiet.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate scroll quieting and protected systems
        run: |
          grep -F '// @version      0.18.9' TornScripture-Item-Market-Margin.user.js
          grep -F 'PRICED_TRADE_SCROLL_QUIET_MS = 280' TornScripture-Item-Market-Margin.user.js
          grep -F 'function capturePricedTradeScroll()' TornScripture-Item-Market-Margin.user.js
          grep -F "document.addEventListener('scroll', capturePricedTradeScroll" TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeDeferredFullRepaint = true;' TornScripture-Item-Market-Margin.user.js
          grep -F "return { mode: 'row', row: activeRow" TornScripture-Item-Market-Margin.user.js
          grep -F 'schedulePricedTradeRowRefresh' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeRenderRowBadge' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradePickerObserver.observe(document.body' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean hotfix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0189_scroll_quiet.py .github/workflows/apply-imm-v0189-pr-release.yml
          git rm --ignore-unmatch scripts/trigger_imm_v0189.txt scripts/trigger_imm_v0189_retry.txt
          git commit -m 'Pause Priced Trade rendering while scrolling'
          git push origin main
