name: PR release GOBLIN GOD v0.18.10

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trigger_imm_v01810.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply loop-kill hotfix
        run: python scripts/apply_imm_v01810_loop_kill.py

      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js

      - name: Validate loop removal and protected systems
        run: |
          grep -F '// @version      0.18.10' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeScrollIsActive()' TornScripture-Item-Market-Margin.user.js
          grep -F 'scrolling must never schedule a Priced Trade repaint' TornScripture-Item-Market-Margin.user.js
          grep -F 'function schedulePricedTradePickerRepaint(delay = 140)' TornScripture-Item-Market-Margin.user.js
          grep -F 'scheduleScan(Math.max(100, Number(delay) || 0));' TornScripture-Item-Market-Margin.user.js
          ! grep -F "document.addEventListener('scroll', capturePricedTradeScroll" TornScripture-Item-Market-Margin.user.js
          ! grep -F 'pricedTradeScrollActiveUntil = Date.now() + PRICED_TRADE_SCROLL_QUIET_MS;' TornScripture-Item-Market-Margin.user.js
          grep -F 'schedulePricedTradeRowRefresh' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeRenderRowBadge' TornScripture-Item-Market-Margin.user.js
          grep -F 'pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'quickMaxOverrideArmed' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js
          grep -F 'inventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -F 'sellPriority' TornScripture-Item-Market-Margin.user.js

      - name: Commit clean hotfix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v01810_loop_kill.py .github/workflows/apply-imm-v01810-pr-release.yml
          git rm --ignore-unmatch scripts/trigger_imm_v01810.txt
          git commit -m 'Kill Priced Trade refresh loop'
          git push origin main
