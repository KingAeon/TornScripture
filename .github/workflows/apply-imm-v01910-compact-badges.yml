name: Apply IMM v0.19.10 compact badges

on:
  push:
    branches:
      - repair/priced-trade-v0.19.10
    paths:
      - scripts/trigger_imm_v01910_compact_badges.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/priced-trade-v0.19.10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Decode and apply compact badge patch
        run: |
          base64 --decode scripts/apply_imm_v01910_compact_badges.py.gz.b64 | gzip --decompress > /tmp/apply_imm_v01910_compact_badges.py
          python /tmp/apply_imm_v01910_compact_badges.py

      - name: Validate JavaScript and protected systems
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.10' TornScripture-Item-Market-Margin.user.js
          grep -F "version: '0.19.10'" TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeCompactBadgeHtml' TornScripture-Item-Market-Margin.user.js
          grep -F "badge.dataset.tsimmAction = 'priced-trade-badge-toggle';" TornScripture-Item-Market-Margin.user.js
          grep -F "action === 'priced-trade-badge-toggle'" TornScripture-Item-Market-Margin.user.js
          grep -F 'height:36px!important' TornScripture-Item-Market-Margin.user.js
          grep -F 'tsimm-priced-trade-details' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeResolvedCandidateRows' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeEnsureNativeMaxButton' TornScripture-Item-Market-Margin.user.js
          grep -F 'function pricedTradeBestTraderQuote' TornScripture-Item-Market-Margin.user.js
          grep -F 'function exactDuplicateLedgerPairs' TornScripture-Item-Market-Margin.user.js
          grep -F 'function ledgerFundingSummary' TornScripture-Item-Market-Margin.user.js
          grep -F 'buildTradeExitAudit' TornScripture-Item-Market-Margin.user.js

      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            scripts/apply_imm_v01910_compact_badges.py.gz.b64 \
            scripts/trigger_imm_v01910_compact_badges.txt \
            .github/workflows/apply-imm-v01910-compact-badges.yml
          git commit -m 'Compact Priced Trade badges with tap details'
          git push origin HEAD:repair/priced-trade-v0.19.10
