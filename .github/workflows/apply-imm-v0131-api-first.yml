name: Apply GOBLIN GOD v0.13.1 API-first inventory

on:
  push:
    paths:
      - scripts/apply_imm_v0131.py
  pull_request:
    paths:
      - scripts/apply_imm_v0131.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply API-first patch
        shell: bash
        run: |
          set +e
          python scripts/apply_imm_v0131.py > /tmp/imm-v0131-patch.log 2>&1
          status=$?
          cat /tmp/imm-v0131-patch.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/imm-v0131-patch.log .github/imm-v0131-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/imm-v0131-patch-error.txt
            git commit -m "Record v0.13.1 patch guard failure" || true
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit "$status"
          fi
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate protected features and API profile
        run: |
          grep -q '@version      0.13.1' TornScripture-Item-Market-Margin.user.js
          grep -q 'function inspectGoblinGodKey' TornScripture-Item-Market-Margin.user.js
          grep -q 'function pageLooksLikeInventory' TornScripture-Item-Market-Margin.user.js
          grep -q 'function validWatchListingRow(row)' TornScripture-Item-Market-Margin.user.js
          grep -q 'function quickMaxMaximum' TornScripture-Item-Market-Margin.user.js
          grep -q 'inventory-open-reconcile' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit release and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0131.py .github/workflows/apply-imm-v0131-api-first.yml .github/imm-v0131-patch-error.txt
          git commit -m "Add API-first inventory key profile in GOBLIN GOD v0.13.1"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
