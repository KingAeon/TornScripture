name: PR release GOBLIN GOD v0.16.0

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: imm-v0160-pr-release
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'imm-v0160-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble focused release patch
        shell: bash
        run: |
          cat scripts/imm_v0160_parts/part*.py > /tmp/apply_imm_v0160_market_velocity.py
          python -m py_compile /tmp/apply_imm_v0160_market_velocity.py
      - name: Apply focused release
        run: python /tmp/apply_imm_v0160_market_velocity.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate market velocity and protected systems
        shell: bash
        run: |
          grep -q '@version      0.16.0' TornScripture-Item-Market-Margin.user.js
          grep -q 'tornscripture-imm-turnover-history-v1' TornScripture-Item-Market-Margin.user.js
          grep -q 'const TURNOVER_CAPTURE_RULES = Object.freeze' TornScripture-Item-Market-Margin.user.js
          grep -q 'function maybeCaptureTurnoverSnapshot' TornScripture-Item-Market-Margin.user.js
          grep -q 'function turnoverProfileFromRecord' TornScripture-Item-Market-Margin.user.js
          grep -q 'function turnoverLeaderboard' TornScripture-Item-Market-Margin.user.js
          grep -q 'LOCAL VELOCITY LEADERS' TornScripture-Item-Market-Margin.user.js
          grep -q 'movement signals, not confirmed sales' TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q 'function setCurrentInventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -q 'function sellPriorityAllowsSelling' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit clean release to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -rf scripts/imm_v0160_parts .github/workflows/apply-imm-v0160-pr-release.yml
          git commit -m 'Add local market velocity learning in GOBLIN GOD v0.16.0'
          git push origin HEAD:main
