name: Apply GOBLIN GOD v0.13.3 inventory category fallback

on:
  push:
    paths:
      - scripts/apply_imm_v0133_inventory_fallback.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused patch
        run: python scripts/apply_imm_v0133_inventory_fallback.py
      - name: Validate JavaScript
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate API fallback and protected systems
        shell: bash
        run: |
          grep -q '@version      0.13.3' TornScripture-Item-Market-Margin.user.js
          grep -q 'const INVENTORY_API_CATEGORIES = Object.freeze' TornScripture-Item-Market-Margin.user.js
          grep -q 'async function fetchInventoryWithFallback' TornScripture-Item-Market-Margin.user.js
          grep -q "captureMode: inventoryResult.mode" TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q "brandName: 'GOBLIN GOD'" TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit release and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f scripts/apply_imm_v0133_inventory_fallback.py .github/workflows/apply-imm-v0133-inventory-category-fallback.yml
          git commit -m 'Add resilient inventory category fallback in GOBLIN GOD v0.13.3'
          git push
