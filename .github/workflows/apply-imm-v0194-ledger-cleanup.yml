name: Release GOBLIN GOD v0.19.4 ledger cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/trigger_imm_v0194_ledger_cleanup.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply and validate
        run: |
          python scripts/apply_imm_v0194_ledger_cleanup.py
          node --check TornScripture-Item-Market-Margin.user.js
          grep -F '// @version      0.19.4' TornScripture-Item-Market-Margin.user.js
          grep -F "ledgerCleanupBackupStorageKey" TornScripture-Item-Market-Margin.user.js
          grep -F "function exactDuplicateLedgerPairs" TornScripture-Item-Market-Margin.user.js
          grep -F "function cleanExactLedgerDuplicates" TornScripture-Item-Market-Margin.user.js
          grep -F "function undoExactLedgerDuplicateCleanup" TornScripture-Item-Market-Margin.user.js
          grep -F "data-tsimm-action=\"ledger-clean-duplicates\"" TornScripture-Item-Market-Margin.user.js
          grep -F "data-tsimm-action=\"ledger-undo-cleanup\"" TornScripture-Item-Market-Margin.user.js
          grep -F "function capturePurchaseDirectlyFromSuccessText" TornScripture-Item-Market-Margin.user.js
          grep -F "function pricedTradeBestTraderQuote" TornScripture-Item-Market-Margin.user.js
          grep -F "function markTraderAvoid" TornScripture-Item-Market-Margin.user.js
          grep -F "buildTradeExitAudit" TornScripture-Item-Market-Margin.user.js

      - name: Commit clean release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm -f \
            .github/workflows/apply-imm-v0194-ledger-cleanup.yml \
            scripts/apply_imm_v0194_ledger_cleanup.py \
            scripts/trigger_imm_v0194_ledger_cleanup.txt
          git commit -m 'Add reversible exact ledger duplicate cleanup'
          git push origin main
