name: IMM v0.19.13 guarded repair

on:
  push:
    branches:
      - repair/imm-v0.19.13-sale-market-health
    paths:
      - .github/workflows/imm-v01913-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Bootstrap IMM v0.19.13 repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore guarded patcher
        shell: bash
        run: |
          tr -d '\n\r ' < tools/apply_imm_v01913.py.gz.b64 | base64 -d | gzip -d > /tmp/apply_imm_v01913.py
          python -m py_compile /tmp/apply_imm_v01913.py

      - name: Apply IMM v0.19.13 repair
        shell: bash
        run: python /tmp/apply_imm_v01913.py

      - name: Validate JavaScript and protected systems
        shell: bash
        run: |
          node --check TornScripture-Item-Market-Margin.user.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('TornScripture-Item-Market-Margin.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      0.19.13',
              'runtime version': "version: '0.19.13'",
              'pending snapshot': 'savePendingTradeSaleFromStats',
              'completion handoff': 'hydrateStatsFromPendingTradeSale',
              'missed sale recovery': 'manual-missed-sale-recovery',
              'recovery control': 'data-tsimm-action="ledger-recover-sale"',
              'market health': 'marketHealthForItem',
              'danger rail': 'tsimm-market-health-danger-row',
              'priced trade': 'pricedTradeRenderRowBadge',
              'MAX control': 'pricedTradeEnsureNativeMaxButton',
              'FIFO sale': 'recordTradeSale',
          }
          missing = [name for name, token in required.items() if token not in text]
          if missing:
              raise SystemExit(f'Missing guarded systems: {missing}')
          if '0.19.12' in text:
              raise SystemExit('Old version marker remains')
          if text.count('function recordTradeSale(') != 1:
              raise SystemExit('recordTradeSale ownership changed unexpectedly')
          if text.count('function pricedTradeRenderRowBadge(') != 1:
              raise SystemExit('Priced Trade row renderer ownership changed unexpectedly')
          print('Static guarded-system validation passed.')
          PY
          git diff --stat

      - name: Commit repaired userscript
        shell: bash
        run: |
          git config user.name 'TornScripture Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git commit -m 'Repair completed sales and market health'
          git push origin HEAD:${{ github.ref_name }}
