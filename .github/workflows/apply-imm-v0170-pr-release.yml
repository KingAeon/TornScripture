name: PR release GOBLIN GOD v0.17.0

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: imm-v0170-pr-release
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'imm-v0170-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: patch-source
          fetch-depth: 1
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble focused release patch
        shell: bash
        run: |
          cat patch-source/scripts/imm_v0170_parts/part*.py > /tmp/apply_imm_v0170_priced_trade.py
          python -m py_compile /tmp/apply_imm_v0170_priced_trade.py
      - name: Apply focused release
        working-directory: release
        run: python /tmp/apply_imm_v0170_priced_trade.py
      - name: Validate JavaScript
        working-directory: release
        run: node --check TornScripture-Item-Market-Margin.user.js
      - name: Validate priced trade and protected systems
        working-directory: release
        shell: bash
        run: |
          grep -q '@version      0.17.0' TornScripture-Item-Market-Margin.user.js
          grep -q 'trader-start-priced-trade' TornScripture-Item-Market-Margin.user.js
          grep -q 'tornscripture-imm-priced-trade-session-v1' TornScripture-Item-Market-Margin.user.js
          grep -q 'function pricedTradeVerification' TornScripture-Item-Market-Margin.user.js
          grep -q 'function applyPricedTradeInventoryBadges' TornScripture-Item-Market-Margin.user.js
          grep -q 'NO CAPTURED PRICE' TornScripture-Item-Market-Margin.user.js
          grep -q 'No prices were applied' TornScripture-Item-Market-Margin.user.js
          grep -q 'function listingRowHasPurchaseControl' TornScripture-Item-Market-Margin.user.js
          grep -q 'data-tsimm-quick-max' TornScripture-Item-Market-Margin.user.js
          grep -q 'OVERRIDE MAX ARMED' TornScripture-Item-Market-Margin.user.js
          grep -q 'function setCurrentInventoryBaseline' TornScripture-Item-Market-Margin.user.js
          grep -q 'function sellPriorityAllowsSelling' TornScripture-Item-Market-Margin.user.js
          ! grep -q '@require' TornScripture-Item-Market-Margin.user.js
      - name: Commit clean release to main
        working-directory: release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TornScripture-Item-Market-Margin.user.js
          git rm .github/workflows/apply-imm-v0170-pr-release.yml
          git commit -m 'Add verified priced-trade inventory badges in GOBLIN GOD v0.17.0'
          git push origin HEAD:main
